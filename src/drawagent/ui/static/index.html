<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>DrawAgent — AI 图像生成</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        @font-face { font-family: 'Inter'; font-style: normal; font-weight: 300 700; font-display: swap;
            src: local('Inter'), local('Segoe UI'), local('Arial'); }
        @font-face { font-family: 'Noto Sans SC'; font-style: normal; font-weight: 300 700; font-display: swap;
            src: local('Noto Sans SC'), local('Microsoft YaHei'), local('PingFang SC'), local('SimHei'), local('sans-serif'); }
        body { font-family: 'Inter', 'Noto Sans SC', -apple-system, 'Microsoft YaHei', 'PingFang SC', sans-serif; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fa-solid fa-wand-magic-sparkles logo-icon"></i>
                    <span class="logo-text">DrawAgent</span>
                </div>
                <button class="sidebar-toggle" id="sidebarToggle" title="切换侧边栏">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
            </div>
            <div class="conversations-list" id="conversationsList">
            </div>
            <div class="sidebar-footer">
                <button class="new-session-btn" id="newSessionBtn">
                    <i class="fa-solid fa-plus"></i>
                    <span>新建会话</span>
                </button>
                <button class="settings-btn" id="settingsBtn">
                    <i class="fa-solid fa-sliders"></i>
                    <span>生成参数</span>
                </button>
                <button class="settings-btn" id="systemSettingsBtn">
                    <i class="fa-solid fa-gear"></i>
                    <span>系统设置</span>
                </button>
            </div>
        </aside>

        <!-- Mobile sidebar overlay mask -->
        <div class="sidebar-mask" id="sidebarMask" onclick="if(document.getElementById('sidebar').classList.contains('mobile-open')){document.getElementById('sidebar').classList.remove('mobile-open');document.getElementById('sidebarMask').classList.remove('active');}"></div>

        <!-- Main Chat Area -->
        <main class="chat-area" id="chatArea">
            <div class="chat-header">
                <button class="sidebar-toggle-mobile" id="sidebarToggleMobile">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="chat-header-info">
                    <h2 class="chat-title" id="chatTitle">DrawAgent</h2>
                    <span class="chat-status" id="chatStatus">就绪</span>
                </div>
                <div class="chat-header-actions">
                    <button class="header-btn lang-btn" id="langToggle" title="Switch Language / 切换语言">
                        <i class="fa-solid fa-language"></i>
                    </button>
                    <button class="header-btn" id="exportSessionBtn" title="导出会话" style="display:none;">
                        <i class="fa-solid fa-download"></i>
                    </button>
                    <button class="header-btn" id="clearChatBtn" title="清空对话">
                        <i class="fa-solid fa-eraser"></i>
                    </button>
                </div>
            </div>

            <!-- Quick Params Bar -->
            <div class="quick-params-bar" id="quickParamsBar">
                <div class="param-item">
                    <label>宽</label><input type="number" id="qpWidth" value="1024" min="512" max="2048" step="64">
                </div>
                <div class="param-item">
                    <label>高</label><input type="number" id="qpHeight" value="1024" min="512" max="2048" step="64">
                </div>
                <div class="param-item">
                    <label>张数</label><input type="number" id="qpCount" value="2" min="1" max="4">
                </div>
                <div class="param-item">
                    <label>步数</label><input type="number" id="qpSteps" value="8" min="4" max="20">
                </div>
                <div class="param-item">
                    <label>引导</label><input type="number" id="qpGuidance" value="3.5" min="1" max="10" step="0.5">
                </div>
                <div class="param-item">
                    <label>种子</label><input type="number" id="qpSeed" value="-1">
                </div>
                <div class="param-item">
                    <label>轮数</label><input type="number" id="qpMaxIter" value="7" min="1" max="15">
                </div>
                <button class="param-toggle" id="paramsToggle" title="收起参数栏">
                    <i class="fa-solid fa-chevron-up"></i>
                </button>
            </div>

            <div class="messages-container" id="messagesContainer">
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="welcome-icon">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                    </div>
                    <h1>DrawAgent</h1>
                    <p>描述你想要的图像，我来为你生成。</p>
                    <div class="welcome-suggestions">
                        <button class="suggestion-chip">一只猫坐在窗台上，金色阳光照进来</button>
                        <button class="suggestion-chip">夜晚的未来城市景观，霓虹灯闪烁</button>
                        <button class="suggestion-chip">一位身着铠甲的战士公主肖像</button>
                        <button class="suggestion-chip">宁静的日本庭院，樱花飘落</button>
                    </div>
                </div>
            </div>

            <div class="input-area" id="inputArea">
                <div class="input-container">
                    <textarea
                        id="promptInput"
                        class="prompt-input"
                        placeholder="描述你想要生成的图像..."
                        rows="1"
                    ></textarea>
                    <button class="send-btn" id="sendButton" title="发送 (Ctrl+Enter)">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
                <div class="interrupt-bar" id="interruptBar" style="display:none;">
                    <span class="interrupt-label">正在生成</span>
                    <div class="interrupt-actions">
                        <button class="interrupt-btn accept" id="acceptBtn" title="接受当前结果">
                            <i class="fa-solid fa-check"></i> 接受
                        </button>
                        <button class="interrupt-btn steer" id="steerBtn" title="调整方向">
                            <i class="fa-solid fa-compass"></i> 修改方向
                        </button>
                        <button class="interrupt-btn pause" id="pauseBtn" title="暂停">
                            <i class="fa-solid fa-pause"></i> 暂停
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Generation Params Panel (slide-in) -->
        <div class="settings-panel" id="settingsPanel">
            <div class="settings-header">
                <h3>生成参数</h3>
                <button class="settings-close" id="settingsClose">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="settings-content">
                <div class="setting-section">
                    <div class="section-title"><i class="fa-solid fa-image"></i> 图像</div>
                    <div class="slider-group">
                        <label class="slider-label" for="widthSlider"><span>宽度</span><span id="widthValue">1024</span></label>
                        <input type="range" class="slider" id="widthSlider" min="512" max="2048" step="64" value="1024">
                    </div>
                    <div class="slider-group">
                        <label class="slider-label" for="heightSlider"><span>高度</span><span id="heightValue">1024</span></label>
                        <input type="range" class="slider" id="heightSlider" min="512" max="2048" step="64" value="1024">
                    </div>
                    <div class="slider-group">
                        <label class="slider-label" for="countSlider"><span>每轮张数</span><span id="countValue">2</span></label>
                        <input type="range" class="slider" id="countSlider" min="1" max="4" step="1" value="2">
                    </div>
                </div>
                <div class="setting-section">
                    <div class="section-title"><i class="fa-solid fa-gear"></i> 质量</div>
                    <div class="slider-group">
                        <label class="slider-label" for="stepsSlider"><span>步数</span><span id="stepsValue">8</span></label>
                        <input type="range" class="slider" id="stepsSlider" min="4" max="20" step="1" value="8">
                    </div>
                    <div class="slider-group">
                        <label class="slider-label" for="guidanceSlider"><span>引导力</span><span id="guidanceValue">3.5</span></label>
                        <input type="range" class="slider" id="guidanceSlider" min="1" max="10" step="0.5" value="3.5">
                    </div>
                    <div class="slider-group">
                        <label class="slider-label" for="seedInput"><span>种子</span><span id="seedValue">-1 (随机)</span></label>
                        <div style="display:flex;gap:8px;align-items:center;">
                            <input type="number" class="text-input" id="seedInput" value="-1" style="flex:1;">
                            <button class="btn btn-secondary" id="randomSeedBtn" style="flex:0;">
                                <i class="fa-solid fa-shuffle"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="setting-section">
                    <div class="section-title"><i class="fa-solid fa-robot"></i> 智能体</div>
                    <div class="slider-group">
                        <label class="slider-label" for="maxIterSlider"><span>最大轮数</span><span id="maxIterValue">7</span></label>
                        <input type="range" class="slider" id="maxIterSlider" min="1" max="15" step="1" value="7">
                    </div>
                    <div class="checkbox-group">
                        <label class="checkbox-label" for="autoAcceptCb">
                            <input type="checkbox" id="autoAcceptCb">
                            <span class="checkbox-custom"></span>
                            质量达标时自动接受
                        </label>
                    </div>
                    <div class="checkbox-group">
                        <label class="checkbox-label" for="showIntermediateCb">
                            <input type="checkbox" id="showIntermediateCb" checked>
                            <span class="checkbox-custom"></span>
                            显示中间结果
                        </label>
                    </div>
                </div>
                <div class="settings-actions">
                    <button class="btn btn-primary" id="applySettingsBtn">应用</button>
                    <button class="btn btn-secondary" id="resetSettingsBtn">重置</button>
                </div>
            </div>
        </div>

        <!-- System Settings Modal -->
        <div class="modal-overlay" id="systemSettingsOverlay">
            <div class="modal-container">
                <div class="modal-header">
                    <h3>系统设置</h3>
                    <button class="modal-close" id="systemSettingsClose">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="setting-section">
                        <div class="section-title"><i class="fa-solid fa-brain"></i> Agent A (主 LLM)</div>
                        <div class="slider-group">
                            <label class="slider-label" for="ssProviderA"><span>Provider</span></label>
                            <input type="text" class="text-input" id="ssProviderA" value="openai">
                        </div>
                        <div class="slider-group">
                            <label class="slider-label" for="ssModelA"><span>模型</span></label>
                            <input type="text" class="text-input" id="ssModelA" value="gpt-4o">
                        </div>
                        <div class="slider-group">
                            <label class="slider-label" for="ssApiBaseA"><span>API Base URL</span></label>
                            <input type="text" class="text-input" id="ssApiBaseA" value="https://api.openai.com/v1">
                        </div>
                        <div class="slider-group">
                            <label class="slider-label" for="ssApiKeyA"><span>API Key</span></label>
                            <input type="password" class="text-input" id="ssApiKeyA" placeholder="sk-...">
                        </div>
                        <div class="slider-group">
                            <label class="slider-label" for="ssTemperatureA"><span>Temperature</span><span id="ssTempValueA">0.7</span></label>
                            <input type="range" class="slider" id="ssTemperatureA" min="0" max="1.5" step="0.1" value="0.7">
                        </div>
                    </div>
                    <div class="setting-section">
                        <div class="section-title"><i class="fa-solid fa-paintbrush"></i> Agent B (生图模型)</div>
                        <div class="slider-group">
                            <label class="slider-label" for="ssTypeB"><span>接入类型</span></label>
                            <select class="text-input" id="ssTypeB">
                                <option value="http">HTTP API</option>
                                <option value="mcp">MCP</option>
                            </select>
                        </div>
                        <div class="slider-group">
                            <label class="slider-label" for="ssApiBaseB"><span>API Base URL</span></label>
                            <input type="text" class="text-input" id="ssApiBaseB" value="http://localhost:8000">
                        </div>
                        <div class="slider-group">
                            <label class="slider-label" for="ssEndpointB"><span>Endpoint</span></label>
                            <input type="text" class="text-input" id="ssEndpointB" value="/api/generate">
                        </div>
                        <div class="slider-group" id="mcpFieldsB" style="display:none;">
                            <label class="slider-label" for="ssMcpCommand"><span>MCP 命令</span></label>
                            <input type="text" class="text-input" id="ssMcpCommand" placeholder="python D:\Code\Z-Image-MCP\mcp_server.py">
                            <label class="checkbox-label" for="ssMcpKeepAlive" style="margin-top:10px;">
                                <input type="checkbox" id="ssMcpKeepAlive" checked>
                                <span class="checkbox-custom"></span>
                                保持 MCP 连接 (关闭以在生成后释放显存)
                            </label>
                        </div>
                    </div>
                    <div class="setting-section">
                        <div class="section-title"><i class="fa-solid fa-eye"></i> Agent C (视觉审查)</div>
                        <div class="slider-group">
                            <label class="slider-label" for="ssProviderC"><span>Provider</span></label>
                            <input type="text" class="text-input" id="ssProviderC" value="openai">
                        </div>
                        <div class="slider-group">
                            <label class="slider-label" for="ssModelC"><span>模型</span></label>
                            <input type="text" class="text-input" id="ssModelC" value="gpt-4o">
                        </div>
                        <div class="slider-group">
                            <label class="slider-label" for="ssApiBaseC"><span>API Base URL</span></label>
                            <input type="text" class="text-input" id="ssApiBaseC" value="https://api.openai.com/v1">
                        </div>
                        <div class="slider-group">
                            <label class="slider-label" for="ssApiKeyC"><span>API Key</span></label>
                            <input type="password" class="text-input" id="ssApiKeyC" placeholder="sk-...">
                        </div>
                        <div class="slider-group">
                            <label class="slider-label" for="ssTemperatureC"><span>Temperature</span><span id="ssTempValueC">0.3</span></label>
                            <input type="range" class="slider" id="ssTemperatureC" min="0" max="1.5" step="0.1" value="0.3">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary" id="applySystemSettingsBtn">保存系统设置</button>
                    <button class="btn btn-secondary" id="resetSystemSettingsBtn">重置</button>
                </div>
            </div>
        </div>

        <!-- Image Viewer Modal -->
        <div class="viewer-overlay" id="viewerOverlay">
            <div class="viewer-container">
                <button class="viewer-close" id="viewerClose">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <button class="viewer-nav prev" id="viewerPrev">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <div class="viewer-image-wrapper">
                    <img id="viewerImage" src="" alt="">
                </div>
                <button class="viewer-nav next" id="viewerNext">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
                <div class="viewer-info" id="viewerInfo">
                    <span id="viewerIndex">1/1</span>
                    <span id="viewerSeed">种子: -</span>
                    <button class="viewer-download-btn" id="viewerDownload" title="下载">
                        <i class="fa-solid fa-download"></i>
                    </button>
                    <button class="viewer-download-btn" id="viewerCopy" title="复制到剪贴板">
                        <i class="fa-solid fa-copy"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Compare View Modal -->
        <div class="compare-overlay" id="compareOverlay">
            <div class="compare-container">
                <div class="compare-header">
                    <h3>迭代对比</h3>
                    <button class="modal-close" id="compareClose"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="compare-body" id="compareBody">
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/api.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/events.js"></script>
    <script src="js/viewer.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            AppState.init();
            I18n.init();
            Renderer.refreshI18n();
            updateSettingsUI();
            updateSystemSettingsUI();
            updateQuickParamsUI();
            syncQuickParams();

            const els = {
                sidebar: document.getElementById('sidebar'),
                sidebarToggle: document.getElementById('sidebarToggle'),
                sidebarToggleMobile: document.getElementById('sidebarToggleMobile'),
                settingsPanel: document.getElementById('settingsPanel'),
                settingsClose: document.getElementById('settingsClose'),
                settingsBtn: document.getElementById('settingsBtn'),
                systemSettingsBtn: document.getElementById('systemSettingsBtn'),
                systemSettingsOverlay: document.getElementById('systemSettingsOverlay'),
                systemSettingsClose: document.getElementById('systemSettingsClose'),
                newSessionBtn: document.getElementById('newSessionBtn'),
                sendButton: document.getElementById('sendButton'),
                promptInput: document.getElementById('promptInput'),
                clearChatBtn: document.getElementById('clearChatBtn'),
                exportSessionBtn: document.getElementById('exportSessionBtn'),
                langToggle: document.getElementById('langToggle'),
                acceptBtn: document.getElementById('acceptBtn'),
                steerBtn: document.getElementById('steerBtn'),
                pauseBtn: document.getElementById('pauseBtn'),
                settingsApply: document.getElementById('applySettingsBtn'),
                settingsReset: document.getElementById('resetSettingsBtn'),
                applySystemSettingsBtn: document.getElementById('applySystemSettingsBtn'),
                resetSystemSettingsBtn: document.getElementById('resetSystemSettingsBtn'),
                viewerOverlay: document.getElementById('viewerOverlay'),
                viewerClose: document.getElementById('viewerClose'),
                viewerPrev: document.getElementById('viewerPrev'),
                viewerNext: document.getElementById('viewerNext'),
                viewerDownload: document.getElementById('viewerDownload'),
                viewerCopy: document.getElementById('viewerCopy'),
                randomSeedBtn: document.getElementById('randomSeedBtn'),
                widthSlider: document.getElementById('widthSlider'),
                heightSlider: document.getElementById('heightSlider'),
                countSlider: document.getElementById('countSlider'),
                stepsSlider: document.getElementById('stepsSlider'),
                guidanceSlider: document.getElementById('guidanceSlider'),
                maxIterSlider: document.getElementById('maxIterSlider'),
                seedInput: document.getElementById('seedInput'),
                ssTemperatureA: document.getElementById('ssTemperatureA'),
                ssTypeB: document.getElementById('ssTypeB'),
                paramsToggle: document.getElementById('paramsToggle'),
                quickParamsBar: document.getElementById('quickParamsBar'),
                compareOverlay: document.getElementById('compareOverlay'),
                compareClose: document.getElementById('compareClose'),
            };

            function toggleSidebar() {
                els.sidebar.classList.toggle('collapsed');
                document.body.classList.toggle('sidebar-collapsed');
                const icon = els.sidebarToggle.querySelector('i');
                icon.classList.toggle('fa-chevron-left');
                icon.classList.toggle('fa-chevron-right');
            }

            els.sidebarToggle.addEventListener('click', toggleSidebar);
            els.sidebarToggleMobile.addEventListener('click', () => {
                if (els.sidebar.classList.contains('collapsed')) {
                    toggleSidebar();
                } else {
                    els.sidebar.classList.toggle('mobile-open');
                }
            });

            els.settingsBtn.addEventListener('click', () => els.settingsPanel.classList.add('active'));
            els.settingsClose.addEventListener('click', () => els.settingsPanel.classList.remove('active'));
            els.systemSettingsBtn.addEventListener('click', () => els.systemSettingsOverlay.classList.add('active'));
            els.systemSettingsClose.addEventListener('click', () => els.systemSettingsOverlay.classList.remove('active'));
            els.systemSettingsOverlay.addEventListener('click', (e) => { if (e.target === els.systemSettingsOverlay) els.systemSettingsOverlay.classList.remove('active'); });
            els.newSessionBtn.addEventListener('click', () => AppActions.newSession());

            els.sendButton.addEventListener('click', () => AppActions.sendMessage());
            els.promptInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); AppActions.sendMessage(); }
                setTimeout(() => { els.promptInput.style.height = 'auto'; els.promptInput.style.height = Math.min(els.promptInput.scrollHeight, 120) + 'px'; }, 0);
            });

            els.clearChatBtn.addEventListener('click', () => {
                if (confirm(_t('clearConfirm'))) { Renderer.clearMessages(); AppState.messages = []; }
            });

            els.exportSessionBtn.addEventListener('click', () => AppActions.exportSession());

            els.langToggle.addEventListener('click', () => {
                I18n.toggleLang();
                Renderer.refreshI18n();
                Renderer.renderWelcome();
                Renderer.showToast(I18n.getLang() === 'zh-CN' ? '已切换为中文' : 'Switched to English', 'info');
                document.querySelectorAll('.suggestion-chip').forEach(chip => {
                    chip.addEventListener('click', () => {
                        document.getElementById('promptInput').value = chip.textContent;
                        AppActions.sendMessage();
                    });
                });
            });

            els.acceptBtn.addEventListener('click', () => AppActions.acceptCurrent());
            els.steerBtn.addEventListener('click', () => AppActions.steer());
            els.pauseBtn.addEventListener('click', () => AppActions.pauseResume());
            els.settingsApply.addEventListener('click', () => AppActions.applySettings());
            els.settingsReset.addEventListener('click', () => AppActions.resetSettings());
            els.applySystemSettingsBtn.addEventListener('click', () => AppActions.applySystemSettings());
            els.resetSystemSettingsBtn.addEventListener('click', () => AppActions.resetSystemSettings());

            els.viewerClose.addEventListener('click', () => Viewer.close());
            els.viewerOverlay.addEventListener('click', (e) => { if (e.target === els.viewerOverlay) Viewer.close(); });
            els.viewerPrev.addEventListener('click', () => Viewer.prev());
            els.viewerNext.addEventListener('click', () => Viewer.next());
            els.viewerDownload.addEventListener('click', () => Viewer.download());
            els.viewerCopy.addEventListener('click', () => Viewer.copy());
            els.randomSeedBtn.addEventListener('click', () => { els.seedInput.value = Math.floor(Math.random() * 1000000); });

            els.paramsToggle.addEventListener('click', () => {
                els.quickParamsBar.classList.toggle('collapsed');
                const icon = els.paramsToggle.querySelector('i');
                icon.classList.toggle('fa-chevron-up');
                icon.classList.toggle('fa-chevron-down');
            });

            els.ssTypeB.addEventListener('change', () => {
                document.getElementById('mcpFieldsB').style.display = els.ssTypeB.value === 'mcp' ? 'block' : 'none';
            });

            els.compareClose.addEventListener('click', () => els.compareOverlay.classList.remove('active'));
            els.compareOverlay.addEventListener('click', (e) => { if (e.target === els.compareOverlay) els.compareOverlay.classList.remove('active'); });

            const sliderPairs = [[els.widthSlider,'widthValue'],[els.heightSlider,'heightValue'],[els.countSlider,'countValue'],[els.stepsSlider,'stepsValue'],[els.guidanceSlider,'guidanceValue'],[els.maxIterSlider,'maxIterValue']];
            sliderPairs.forEach(([slider, displayId]) => slider.addEventListener('input', () => document.getElementById(displayId).textContent = slider.value));
            els.seedInput.addEventListener('input', () => {
                const v = els.seedInput.value;
                document.getElementById('seedValue').textContent = v === '-1' ? '-1 (' + _t('labelRandom') + ')' : v;
            });
            els.ssTemperatureA.addEventListener('input', () => {
                document.getElementById('ssTempValueA').textContent = els.ssTemperatureA.value;
            });
            const ssTemperatureC = document.getElementById('ssTemperatureC');
            if (ssTemperatureC) ssTemperatureC.addEventListener('input', () => {
                document.getElementById('ssTempValueC').textContent = ssTemperatureC.value;
            });

            // Quick params sync
            ['qpWidth','qpHeight','qpCount','qpSteps','qpGuidance','qpSeed','qpMaxIter'].forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.addEventListener('change', () => {
                        const p = AppState.settings.generationParams;
                        switch (id) {
                            case 'qpWidth': p.width = parseInt(el.value); break;
                            case 'qpHeight': p.height = parseInt(el.value); break;
                            case 'qpCount': p.numImages = parseInt(el.value); break;
                            case 'qpSteps': p.steps = parseInt(el.value); break;
                            case 'qpGuidance': p.guidance = parseFloat(el.value); break;
                            case 'qpSeed': p.seed = parseInt(el.value) || -1; break;
                            case 'qpMaxIter': AppState.settings.maxIterations = parseInt(el.value); break;
                        }
                        AppState.saveSettings();
                        updateSettingsUI();
                    });
                }
            });

            document.querySelectorAll('.suggestion-chip').forEach(chip => chip.addEventListener('click', () => { els.promptInput.value = chip.textContent; AppActions.sendMessage(); }));
            AppActions.refreshSessions();

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                // Esc: cancel generation / close viewer / close panels
                if (e.key === 'Escape') {
                    if (Viewer.isOpen) { Viewer.close(); return; }
                    if (document.getElementById('settingsPanel').classList.contains('active')) { document.getElementById('settingsPanel').classList.remove('active'); return; }
                    if (document.getElementById('systemSettingsOverlay').classList.contains('active')) { document.getElementById('systemSettingsOverlay').classList.remove('active'); return; }
                    if (AppState.isLoading) { AppActions.pauseResume(); return; }
                }
                // Ctrl+Shift+N: new session
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'N') {
                    e.preventDefault(); AppActions.newSession();
                }
            });

            // Sidebar mobile mask
            const mask = document.getElementById('sidebarMask');
            const observer = new MutationObserver(() => {
                mask.classList.toggle('active', els.sidebar.classList.contains('mobile-open'));
            });
            observer.observe(els.sidebar, { attributes: true, attributeFilter: ['class'] });

            // Viewer pinch-zoom
            let pinchStartDist = 0, pinchScale = 1;
            document.getElementById('viewerImage').addEventListener('touchstart', (e) => {
                if (e.touches.length === 2) pinchStartDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            });
            document.getElementById('viewerImage').addEventListener('touchmove', (e) => {
                if (e.touches.length === 2) {
                    const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                    pinchScale = Math.min(3, Math.max(0.5, dist / pinchStartDist));
                    e.target.style.transform = `scale(${pinchScale})`;
                }
            });
            document.getElementById('viewerImage').addEventListener('touchend', () => { e => e.target.style.transform = ''; });

            // Request notification permission on first interaction
            document.addEventListener('click', () => { AppActions.requestNotificationPermission(); }, { once: true });
        });
    </script>
</body>
</html>
