[project]
name = "drawagent"
version = "0.1.0"
description = "AI-powered image generation agent system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "DrawAgent Team" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "Pillow>=10.0.0",
    "structlog>=24.0.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "anyio>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx2>=0.1.0",
    "ruff>=0.4.0",
    "pyright>=1.1.0",
]

[project.scripts]
drawagent = "drawagent.main:main"

[tool.setuptools]
packages = ["drawagent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.11"
reportMissingTypeStubs = false
reportUnknownMemberType = false
